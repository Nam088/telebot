name: "Bug Report"
description: "Report a bug or unexpected behavior in telebot-ts"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug in telebot-ts!
  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When running polling with drop_pending_updates, the bot..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal Reproduction Steps and Code"
      description: "Please provide a minimal, self-contained code snippet to reproduce the issue."
      render: typescript
      placeholder: |
        import { Application } from "telebot-ts";
        const app = new Application("123456:TOKEN");
        // Steps to trigger the bug...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "The handler should execute without throwing..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "Node.js version, OS, telebot-ts version."
      placeholder: "Node.js v22.12.0, macOS Sequoia, telebot-ts v1.0.0"
    validations:
      required: true
