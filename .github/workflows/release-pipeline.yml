name: Semantic Release Automation

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'packages/node/**'
      - 'packages/go/**'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc.json'
      - '.github/workflows/release-pipeline.yml'
      - '.github/workflows/go-release.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release (Multi-Branch Engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Quality Gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

      - name: Run Semantic Release (OIDC Trusted Publishing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Mirror Go tag with the same version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f RELEASE_VERSION ]; then
            echo "No release published; skipping Go tag mirror."
            exit 0
          fi
          VERSION="$(cat RELEASE_VERSION)"
          case "$VERSION" in
            *[!0-9a-zA-Z.-]*) echo "Unexpected version format"; exit 1 ;;
          esac
          GO_TAG="packages/go/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$GO_TAG"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${GO_TAG}"
