name: Semantic Release Automation

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'packages/node/**'
      - 'packages/go/**'
      - 'packages/python/**'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc.json'
      - '.github/workflows/release-pipeline.yml'
      - '.github/workflows/go-release.yml'
      - '.github/workflows/python-release.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  # Required so the "Dispatch Python release workflow" step can call the
  # workflow_dispatch API with GITHUB_TOKEN.
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release (Multi-Branch Engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Quality Gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

      - name: Run Semantic Release (OIDC Trusted Publishing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Mirror Go tag with the same version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f RELEASE_VERSION ]; then
            echo "No release published; skipping Go tag mirror."
            exit 0
          fi
          VERSION="$(cat RELEASE_VERSION)"
          case "$VERSION" in
            *[!0-9a-zA-Z.-]*) echo "Unexpected version format"; exit 1 ;;
          esac
          GO_TAG="packages/go/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$GO_TAG"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${GO_TAG}"

      - name: Mirror Python tag with the same version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f RELEASE_VERSION ]; then
            echo "No release published; skipping Python tag mirror."
            exit 0
          fi
          VERSION="$(cat RELEASE_VERSION)"
          case "$VERSION" in
            *[!0-9a-zA-Z.-]*) echo "Unexpected version format"; exit 1 ;;
          esac
          PY_TAG="packages/python/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$PY_TAG"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${PY_TAG}"

      # Tags pushed with GITHUB_TOKEN do not trigger workflows, so the Python
      # release workflow is dispatched explicitly at the mirrored tag.
      - name: Dispatch Python release workflow
        if: ${{ hashFiles('RELEASE_VERSION') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(cat RELEASE_VERSION)"
          case "$VERSION" in
            *[!0-9a-zA-Z.-]*) echo "Unexpected version format"; exit 1 ;;
          esac
          gh workflow run python-release.yml --ref "packages/python/v${VERSION}"

      # Tags pushed with GITHUB_TOKEN do not trigger workflows, so the Go
      # GitHub Release is created here instead of relying on go-release.yml.
      - name: Resolve Go release version
        id: gover
        if: ${{ hashFiles('RELEASE_VERSION') != '' }}
        run: echo "version=$(cat RELEASE_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify Go build on release commit
        if: steps.gover.outputs.version != ''
        working-directory: packages/go
        run: |
          go build ./...
          go vet ./...

      - name: Generate Go release notes
        if: steps.gover.outputs.version != ''
        uses: orhun/git-cliff-action@v4
        with:
          config: packages/go/cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: go-release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create Go GitHub Release
        if: steps.gover.outputs.version != ''
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: telebot-go v${{ steps.gover.outputs.version }}
          tag_name: packages/go/v${{ steps.gover.outputs.version }}
          body_path: go-release-notes.md
          draft: false
          prerelease: false
          make_latest: "false"
