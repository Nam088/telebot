name: Release & Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # Bắt buộc cho NPM OIDC Trusted Publisher & Provenance

jobs:
  release-please:
    name: Run Google Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please Action
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      # Khi Release PR được merge, tự động checkout code phiên bản mới
      - name: Checkout Code
        uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Setup Node.js 22.x with NPM OIDC Registry
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
        if: ${{ steps.release.outputs.release_created }}

      - name: Install Dependencies
        run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - name: Run Full Quality Gates (Format, Lint, Build, Tests, Docs)
        run: |
          npm run format:check
          npm run lint
          npm run build
          npm run test:coverage
          npm run docs
        if: ${{ steps.release.outputs.release_created }}

      # Publish lên NPM hoàn toàn không cần secret token - sử dụng NPM OIDC Trusted Publisher & Provenance
      - name: Publish to NPM via OIDC Trusted Publishing
        run: npm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}
