name: Check Telegram Bot API Updates

on:
  schedule:
    # Chạy vào 02:00 UTC (09:00 sáng Thứ Hai giờ VN hàng tuần)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bằng tay trên GitHub bất cứ lúc nào

jobs:
  check-updates:
    name: Check Telegram Bot API Updates
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Telegram API update checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/check-telegram-updates.mjs

      - name: Commit updated state (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_api_state.json || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update telegram bot api tracker state"
            git push
          fi
