name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-node:
    name: Node.js Test & Lint (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting (Prettier)
        run: npm run format:check

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Compile TypeScript Build
        run: npm run build:node

      - name: Run Unit & Integration Tests (Coverage)
        run: npm run test:coverage

      - name: Build TypeDoc Documentation
        run: npm run docs

  test-go:
    name: Golang Test & Build (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "1.23"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: packages/go/go.sum

      - name: Run Go Unit Tests
        working-directory: packages/go
        run: go test -v -race ./...

      - name: Compile Go Packages
        working-directory: packages/go
        run: go build ./...

  test-python:
    name: Python Test & Lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install Dependencies
        working-directory: packages/python
        run: pip install -e ".[dev]"

      - name: Run Linter (ruff)
        working-directory: packages/python
        run: ruff check src tests

      - name: Check Formatting (ruff)
        working-directory: packages/python
        run: ruff format --check src tests

      - name: Type Check (mypy --strict)
        working-directory: packages/python
        run: mypy --strict src

      - name: Run Unit & Integration Tests (Coverage)
        working-directory: packages/python
        run: pytest --cov=telebot_py --cov-report=term-missing --cov-fail-under=80

      - name: Parity Audit (node/go/python)
        working-directory: packages/python
        run: python scripts/parity_audit.py

  # Advisory only: this job reports Bot API coverage drift but cannot fail the
  # build while the three packages still close gaps. Remove the continue-on-error
  # flags once `npm run audit:fidelity` exits 0 on every package.
  bot-api-fidelity:
    name: Bot API Docs Fidelity (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Run Docs Parser Self-Tests (offline fixtures)
        run: npm run test:scripts

      - name: Build Bot API Oracle From Live Docs
        run: npm run audit:docs

      - name: Report Per-Package Coverage
        continue-on-error: true
        run: npm run audit:fidelity
