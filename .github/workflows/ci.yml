name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-node:
    name: Node.js Test & Lint (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting (Prettier)
        run: npm run format:check

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Compile TypeScript Build
        run: npm run build:node

      - name: Run Unit & Integration Tests (Coverage)
        run: npm run test:coverage

      - name: Build TypeDoc Documentation
        run: npm run docs

  test-go:
    name: Golang Test & Build (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "1.23"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: packages/go/go.sum

      - name: Run Go Unit Tests
        working-directory: packages/go
        run: go test -v -race ./...

      - name: Compile Go Packages
        working-directory: packages/go
        run: go build ./...
