name: Deploy TypeDoc to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/node/**'
      - 'packages/python/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/pages/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript project
        run: npm run build:node

      - name: Generate TypeDoc documentation
        run: npm run docs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install telebot-py docs dependencies
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate Sphinx documentation
        working-directory: packages/python
        run: sphinx-build -W --keep-going docs docs/_build/html

      - name: Assemble combined docs site
        run: |
          mkdir -p site/node site/python
          cp -r packages/node/docs/. site/node/
          cp -r packages/python/docs/_build/html/. site/python/
          cp -r .github/pages/plugins site/plugins
          cp .github/pages/index.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
