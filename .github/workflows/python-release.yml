name: Python Release

# Creates a GitHub Release and publishes telebot-py to PyPI whenever changes
# in packages/python are merged to main or a telebot-py tag (packages/python/v*)
# is pushed. Release notes are generated automatically by git-cliff. PyPI
# publishing uses trusted publishing (OIDC) — no static API tokens required.

on:
  push:
    branches:
      - main
    paths:
      - "packages/python/**"
      - ".github/workflows/python-release.yml"
    tags:
      - "packages/python/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.7.1, or leave empty for auto-bump)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Python Test, Build & Publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: packages/python/pyproject.toml

      - name: Set up Node.js (for version resolution)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: packages/python
        run: |
          pip install -e ".[dev]"
          pip install build

      - name: Run Python Quality Gates
        working-directory: packages/python
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy --strict src
          pytest --cov=telebot_py --cov-report=term-missing --cov-fail-under=80

      - name: Resolve Release Version
        id: resolver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          EXTRA_ARGS=""
          if [ "$REF_TYPE" = "tag" ]; then
            EXTRA_ARGS="--tag $REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            EXTRA_ARGS="--version $INPUT_VERSION"
          fi
          node scripts/resolve-release-version.mjs --package python $EXTRA_ARGS --output-file "$GITHUB_OUTPUT"

      - name: Sync Package Version
        if: steps.resolver.outputs.should_release == 'true'
        working-directory: packages/python
        env:
          VERSION: ${{ steps.resolver.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" src/telebot_py/__init__.py

      - name: Build Wheel and Sdist
        if: steps.resolver.outputs.should_release == 'true'
        working-directory: packages/python
        run: python -m build

      - name: Generate Python Release Notes
        if: steps.resolver.outputs.should_release == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: packages/python/cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: python-release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        if: steps.resolver.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: telebot-py v${{ steps.resolver.outputs.version }}
          tag_name: ${{ steps.resolver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: python-release-notes.md
          draft: false
          prerelease: false
          make_latest: "false"

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.resolver.outputs.should_release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
