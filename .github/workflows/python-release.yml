name: Python Release

# Creates a GitHub Release and publishes telebot-py to PyPI whenever a
# telebot-py tag (packages/python/vX.Y.Z) is pushed. Tags are mirrored
# automatically by the release pipeline so Node, Go, and Python always share
# the same version number. Release notes are generated automatically from
# conventional commits by git-cliff. PyPI publishing uses trusted publishing
# (OpenID Connect) — no long-lived API tokens are stored as secrets.

on:
  push:
    tags:
      - "packages/python/v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Must match the Environment name registered in the PyPI trusted
    # publisher for telebot-py.
    environment: pypi
    permissions:
      contents: write
      # Required by pypa/gh-action-pypi-publish for trusted publishing.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync package version with tag
        working-directory: packages/python
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            packages/python/v*) ;;
            *) echo "Ref '$REF_NAME' is not a packages/python/v* tag"; exit 1 ;;
          esac
          VERSION="${REF_NAME#packages/python/v}"
          case "$VERSION" in
            *[!0-9a-zA-Z.+!-]*) echo "Unexpected version format"; exit 1 ;;
          esac
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" src/telebot_py/__init__.py

      - name: Verify tagged commit builds
        working-directory: packages/python
        run: |
          pip install build
          python -m build

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: packages/python/cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: python-release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Resolve version name
        id: ver
        run: echo "version=${GITHUB_REF_NAME#packages/python/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: telebot-py ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: python-release-notes.md
          draft: false
          prerelease: false
          # Node releases (vX.Y.Z from semantic-release) remain the repo "latest".
          make_latest: "false"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
