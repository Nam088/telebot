# git-cliff configuration for the Go framework (packages/go).
#
# Release notes are generated from conventional commits whenever a tag
# matching `packages/go/v*` is pushed (see .github/workflows/go-release.yml).

[changelog]
header = "# telebot-go Release Notes\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="packages/go/v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^style", group = "Styling" },
  { message = "^revert", group = "Reverts" },
  { message = "^chore|^ci|^build", skip = true },
]
# Only telebot-go release tags participate; Node releases use plain vX.Y.Z.
tag_pattern = "packages/go/v[0-9].*"
topo_order = false
sort_commits = "oldest"
