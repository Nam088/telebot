# git-cliff configuration for the Python framework (packages/python).
#
# Release notes are generated from conventional commits whenever a tag
# matching `packages/python/v*` is pushed (see .github/workflows/python-release.yml).

[changelog]
header = "# telebot-py Release Notes\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="packages/python/v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^style", group = "Styling" },
  { message = "^revert", group = "Reverts" },
  { message = "^chore|^ci|^build", skip = true },
]
# Only telebot-py release tags participate; Go releases use packages/go/vX.Y.Z
# and Node releases use plain vX.Y.Z.
tag_pattern = "packages/python/v[0-9].*"
# Scope changelog entries to commits touching the Python package so that
# Node/Go changes never leak into telebot-py release notes.
include_paths = ["packages/python/*"]
topo_order = false
sort_commits = "oldest"
