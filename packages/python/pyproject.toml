[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telebot-py"
version = "1.4.0"
description = "Async-first Telegram Bot framework for Python, mirroring python-telegram-bot's API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nam088" }]
keywords = ["telegram", "bot", "framework", "asyncio", "python-telegram-bot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]
# Sole required runtime dependency (user-approved relaxation of the repo's
# zero-dependency rule, scoped to packages/python — see specs/001 NFR-1).
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "sphinx>=7.0",
]

[project.urls]
Homepage = "https://github.com/Nam088/telegram-bot-node"
Repository = "https://github.com/Nam088/telegram-bot-node"
Issues = "https://github.com/Nam088/telegram-bot-node/issues"
Changelog = "https://github.com/Nam088/telegram-bot-node/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/telebot_py"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "LICENSE", "README.md"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "ASYNC", # flake8-async
  "RET", # flake8-return
]

[tool.ruff.lint.isort]
known-first-party = ["telebot_py"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/telebot_py"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: requires a real bot token in TEST_BOT_TOKEN; auto-skipped when unset",
]

[tool.coverage.run]
source = ["telebot_py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
